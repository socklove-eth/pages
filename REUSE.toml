version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "SockLove"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["logo.png", "favicon.png"]
precedence = "override"
SPDX-FileCopyrightText = "SockLove"
SPDX-License-Identifier = "LicenseRef-SockLove-Marks"

[[annotations]]
path = ["fonts/cinzel-latin.woff2", "fonts/outfit-latin.woff2", "fonts/OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = ["2020 The Cinzel Project Authors", "2021 The Outfit Project Authors"]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "localnet/artifacts/safe/**"
precedence = "override"
SPDX-FileCopyrightText = "safe-global/safe-smart-account contributors"
SPDX-License-Identifier = "LGPL-3.0-only"

[[annotations]]
path = ["localnet/artifacts/ens/ENSRegistryWithFallback.code", "localnet/artifacts/ens/PublicResolver.code", "localnet/artifacts/ens/deployments/**"]
precedence = "override"
SPDX-FileCopyrightText = "2018 True Names Limited"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "localnet/artifacts/ens/ENSRegistry.code"
precedence = "override"
SPDX-FileCopyrightText = "2018 True Names Limited"
SPDX-License-Identifier = "BSD-2-Clause"
